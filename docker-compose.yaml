services:
  app_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis-moneyflow:
    image: redis:alpine
    container_name: redis-moneyflow
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # PERINTAH MUTLAK: Paksa Redis nulis data ke disk, bukan cuma di RAM
    command: redis-server --appendonly yes
volumes:
  db_data:
  redis_data:

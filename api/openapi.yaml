openapi: 3.0.3
info:
  title: Cashflow API
  version: 1.0.0
  description: Dokumentasi API Cashflow dengan arsitektur Design-First

servers:
  - url: /api
    description: API Base URL

tags:
  - name: Auth
    description: Endpoint untuk registrasi dan autentikasi
  - name: Users
    description: Endpoint terkait user
  - name: Transactions
    description: Endpont terkait transaksi
  - name: Categories
    description: Manajemen kategori transaksi (Income/Expense)
  - name: Wallets
    description: Manajemen Dompet
  - name: Groups
    description: Manajemen Grup Patungan

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- BASE RESPONSES BEGIN ---
    SuccessBaseRes:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "Success"

    500BaseRes:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "Server Error"
        errors:
          type: string
          example: "There is a problem with the server"

    400BaseRes:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "Bad Request"
        errors:
          type: string
          example: "There is a problem with the request"
    # --- BASE RESPONSES BEGIN ---

    # --- ENTITAS UTAMA ---
    #--------------- USER BEGIN ---------------
    UserRes:
      type: object
      required:
        - id
        - username
        - email
        - user_role
      properties:
        id:
          type: string
          example: "string"
        username:
          type: string
          example: "john_doe"
        email:
          type: string
          example: "john.doe@example.com"
        user_role:
          type: string
          example: "USER"
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/WalletRes"

    UpdateSystemUserReq:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
          example: "john.doe"
        email:
          type: string
          example: "john.doe@example.com"
#        user_role:
#          type: string
#          enum:
#            - admin
#            - moderator
#            - user
#          example: "user"

    ChangePassword:
      type: object
      required:
        - old_password
        - new_password
        - confirm_new_password
      properties:
        old_password:
          type: string
          example: "password123"
        new_password:
          type: string
          example: "password123"
        confirm_new_password:
          type: string
          example: "password123"

    ForgotPassword :
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: "john.doe@example.com"
        password:
          type: string
          example: "newpassword123"

    UserBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserRes"

    UserListRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/UserRes"
            meta:
              $ref: "#/components/schemas/PaginationMeta"
    #--------------- USER END ---------------
    #--------------- WALLET BEGIN -------------
    WalletRes:
      type: object
      required:
        - id
        - balance
        - name
        - transaction_count
        - group_id
        - transactions
      properties:
        id:
          type: string
        balance:
          type: integer
          format: int64
          example: 100000
        name:
          type: string
          example: "Wallet Gaji"
        transaction_count:
          type: integer
          format: int64
          example: 10
        group_id:
          type: string
          nullable: true
          example: "123e4567-e89b-12d3-a456-426655440000"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionRes"

    WalletBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WalletRes"

    WalletListBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WalletRes"
            meta:
              $ref: "#/components/schemas/PaginationMeta"

    CreateWalletReq:
      type: object
      required:
        - name
        - currency
      properties:
        name:
          type: string
          example: "Wallet Utama"
        currency:
          type: string
          example: "IDR"
          default: "IDR"
        groupId:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"

    UpdateWalletReq:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Wallet Utama"
        type:
          type: string
          example: "Income"

    #--------------- WALLET END -------------
    #--------------- TRANSACTION BEGIN -------------
    TransactionRes:
      type: object
      required:
        - id
        - title
        - amount
        - date
        - category
        - user
      properties:
        id:
          type: string
        title:
          type: string
          example: "Gaji Bulanan"
        amount:
          type: integer
          format: int64
          example: 100000
        description:
          type: string
          example: "Gaji bulan Januari 2026"
        date:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        category:
          $ref: "#/components/schemas/CategoryRes"
        user:
          $ref: "#/components/schemas/UserRes"

    TxWithWallet:
      allOf:
        - $ref: "#/components/schemas/TransactionRes"
        - type: object
          properties:
            wallet:
              $ref: "#/components/schemas/WalletRes"

    TransactionBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TransactionRes"

    TransactionListRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TransactionRes"

            meta:
              $ref: "#/components/schemas/PaginationMeta"

    TxWithWalletBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxWithWallet"

    CreateTransactionReq:
      type: object
      required:
        - wallet_id
        - title
        - amount
        - category_id
        - date
      properties:
        wallet_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"
        title:
          type: string
          example: "Gaji Bulanan"
        amount:
          type: integer
          format: int64
          example: 100000
        description:
          type: string
          example: "Gaji bulan Januari 2026"
        category_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"
        date:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"

    UpdateTransactionReq:
      type: object
      required:
        - title
        - amount
        - description
        - category_id
        - date
      properties:
        title:
          type: string
          example: "Gaji Bulanan"
        amount:
          type: integer
          format: int64
          example: 100000
        description:
          type: string
          example: "Gaji bulan Januari 2026"
        category_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"
        date:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
    #--------------- TRANSACTION END -------------
    #--------------- CATEGORY BEGIN -------------
    CategoryRes:
      type: object
      required:
        - id
        - user_id
        - name
        - type
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"
        user_id:
          type: string
          nullable: true
        group_id:
          type: string
          nullable: true
        name:
          type: string
          example: "Makanan"
        type:
          type: string
          example: "Expense"

    CategoryBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CategoryRes"

    CategoryListBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CategoryRes"
            meta:
              $ref: "#/components/schemas/PaginationMeta"

    UpdateCategoryReq:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: "Makanan"
        type:
          type: string
          example: "expense"
        group_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"
        user_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"

    CreateCategoryReq:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: "Makanan"
        type:
          type: string
          example: "expense"
        group_id:
          type: string
          nullable: true
          example: "123e4567-e89b-12d3-a456-426655440000"
        user_id:
          type: string
          nullable: true
          example: "123e4567-e89b-12d3-a456-426655440000"
    #--------------- CATEGORY END -------------
    #--------------- AUTH BEGIN ---------------
    AuthLoginRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    RegisterReq:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: "john_doe"
        email:
          type: string
          example: "john.doe@example.com"
        password:
          type: string
          example: "password123"

    LoginReq:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: "john.doe@example.com"
        password:
          type: string
          example: "password123"

    #--------------- AUTH END ---------------
    #--------------- GROUP BEGIN ---------------
    CreateGroupReq:
      type: object
      required:
        - name
        - memberids
      properties:
        name:
          type: string
          example: "Group Utama"
        memberids:
          type: array
          items:
            type: string
            example: "123e4567-e89b-12d3-a456-426655440000"
        description:
          type: string
          example: "Group ini adalah group utama"

    UpdateGroupReq:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: "Group Utama Baru"
          default: "Lorem Ipsum"
        description:
          type: string
          example: "Deskripsi group yang diupdate"
          default: "This Is Description"

    GroupMembersRes:
      type: object
      required:
        - id
        - username
        - role
        - userId
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"
        username:
          type: string
          example: "john_doe"
        role:
          type: string
          example: "ADMIN"
        userId:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"

    GroupRes:
      type: object
      required:
        - id
        - name
        - wallet
        - members
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426655440000"
        name:
          type: string
          example: "Group Utama"
        description:
          type: string
          example: "Group ini adalah group utama"
        wallet:
          type: array
          items:
            $ref: "#/components/schemas/WalletRes"
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMembersRes"

    GroupBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GroupRes"
    GroupListBaseRes:
      allOf:
        - $ref: "#/components/schemas/SuccessBaseRes"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/GroupRes"
            meta:
              $ref: "#/components/schemas/PaginationMeta"
    #--------------- GROUP END -----------------
    #--------------- Meta Start -----------------
        # Tambahkan ini di deretan komponen lu
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        total_pages:
          type: integer
          example: 5
        total_items:
          type: integer
          example: 50
    #--------------- Meta END -----------------
paths:
  # ==========================================
  # AUTH DOMAIN
  # ==========================================
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register User
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterReq"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login User
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginReq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Forgot Password
      operationId: forgot_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPassword"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"


  # ==========================================
  # USER DOMAIN
  # ==========================================
  /users/:
    get:
      tags:
        - Users
      summary: Find All Users
      operationId: findAllUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          required: true
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Jumlah data per halaman
          required: true
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"
  /users/me:
    get:
      tags:
        - Users
      summary: Get My Profile
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"

    put:
      tags:
        - Users
      summary: Update my profile
      description: update profile dengan user itu sendiri
      operationId: updateMyProfile
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSystemUserReq"
      responses:
        "200":
          description: Update Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"


  /users/{id}:
    get:
      tags:
        - Users
      summary: Find User By ID
      operationId: findUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"

    put:
      tags:
        - Users
      summary: Update User By ID
      description: untuk update by user - admin aja, bukan update sendiri
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSystemUserReq"
      responses:
        "200":
          description: Update Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"

  /users/{id}/change-role-to-admin:
    put:
      tags:
        - Users
      summary: Chage system role to admin
      description: Endpoint untuk mengganti userRole = 3 ke userRole = 1, admin only can change
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"
  # ==========================================
  # Transaction DOMAIN
  # ==========================================
  /transactions:
    get:
      tags:
        - Transactions
      summary: Get All Transactions
      description: Endpoint untuk menampilkan semua transaksi by limit dan page
      operationId: getTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          required: true
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Jumlah data per halaman
          required: true
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"
    post:
      tags:
        - Transactions
      summary: Create Transaction
      description: Endpoint untuk membuat transaksi
      operationId: createTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionReq"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionBaseRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Find Transaction By ID
      description: Endpoint untuk menampilkan detail transaksi
      operationId: findTransactionById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Transaction ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionBaseRes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400BaseRes"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/500BaseRes"
    put:
      tags:
        - Transactions
      summary: Update Transaction By ID
      description: Endpoint untuk update transaksi
      operationId: updateTransaction
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Transaction ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionReq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
